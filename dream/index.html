<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FACE SCAN BY ILUSM</title>
    <link rel="stylesheet" href="style.css">
    <script defer src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.js"></script>
    <script defer src="app.js"></script>
</head>

<body>
    <div class="container">
        <header>
            <h1>ILUSM scanner</h1>
            <p id="model-status" class="status-loading">Đang nạp dữ liệu khuôn mặt & AI...</p>
        </header>

        <div class="input-group">
            <input type="text" id="search-name" placeholder="Nhập tên người cần kiểm tra...">
            <button id="start-scan-btn" disabled>Quét ngay</button>
        </div>

        <div class="camera-box">
            <video id="video" autoplay muted playsinline></video>
            <canvas id="overlay"></canvas>
            <div id="laser-beam" class="laser"></div>
            <div id="hud-text" class="hud-overlay">SẴN SÀNG</div>
        </div>

        <div id="result-panel" class="result-card hidden">
            <div class="result-row">
                <span>Kết quả:</span>
                <strong id="match-status">---</strong>
            </div>
            <div class="result-row">
                <span>Độ giống:</span>
                <strong id="similarity-score">0%</strong>
            </div>
            <div class="progress-bar">
                <div id="similarity-fill" class="progress-fill"></div>
            </div>
            <button id="rescan-btn" class="secondary-btn">Quét lại</button>
            <button id="stop-cam-btn" class="stop-cam-btn" type="button">Tắt camera</button>
        </div>
    </div>
</body>
<!-- Hộp thoại thông báo nhỏ tùy chỉnh -->
  <div id="custom-modal" class="modal-backdrop hidden">
    <div class="modal-box">
      <div class="modal-icon">!</div>
      <h3 id="modal-title">THÔNG BÁO</h3>
      <p id="modal-message">Nội dung thông báo</p>
      <button id="modal-ok-btn" type="button">OK</button>
    </div>
  </div>
</body>

</html>
